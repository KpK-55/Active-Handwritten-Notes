<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202326"><link rel="manifest" href="manifest.webmanifest"><title>Recall Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#202326;color:#e6e9eb;font:14px system-ui;overflow:hidden}.hidden{display:none!important}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}.app{height:100dvh;display:flex}.side{width:215px;background:#1b1e21;padding:16px 11px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}.brand{font-weight:700;padding:8px 9px 22px}.mark{display:inline-grid;place-items:center;background:#42a9bd;color:#102024;border-radius:8px;width:27px;height:27px;margin-right:8px}.nav,.subject{background:transparent;text-align:left;padding:11px;border-radius:7px;color:#bdc6cb}.nav.active,.subject.active,.nav:hover,.subject:hover{background:#34434a;color:white}.label{font-size:10px;color:#74818a;letter-spacing:1.3px;padding:20px 10px 6px}.bottom{margin-top:auto;border-top:1px solid #383e43;padding-top:9px}.main{flex:1;min-width:0;padding:32px 4vw;overflow:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#829098}h1{font-size:27px;margin:5px 0}.actions{display:flex;gap:9px}.search{background:#2a2f33;border:1px solid #41484e;border-radius:8px;padding:10px;width:230px}.primary{background:#258fa5;border-radius:8px;padding:10px 15px}.subhead{display:flex;justify-content:space-between;color:#87939a;font-size:12px;margin:30px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,175px));gap:20px}.card{background:none;text-align:left}.preview{height:205px;background:#08090b;border:1px solid #454c52;border-radius:7px;display:grid;place-items:center;color:#4eb4c4;font-size:32px}.name{margin-top:8px}.meta{font-size:11px;color:#89949b}.empty{text-align:center;margin:12vh auto;color:#a8b1b6}.editor{height:100dvh;display:flex;flex-direction:column}.top{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#25292d;border-bottom:1px solid #3b4248}.ib{background:transparent;border-radius:7px;width:34px;height:34px;font-size:20px}.ib:hover{background:#3a4248}.title{background:none;border:0;outline:0;width:min(300px,35vw);font-size:14px}.status{font-size:10px;color:#78bca6;flex:1}.tools{background:#292d31;border-bottom:1px solid #42484d}.row{display:flex;align-items:center;gap:4px;padding:4px 10px;min-height:47px;overflow-x:auto}.tool{min-width:43px;height:42px;border-radius:7px;background:none;color:#cbd3d7;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}.tool small{font-size:9px;color:#9ba6ac}.tool.active,.tool:hover{background:#3c484e;color:#78cbd4}.sep{height:25px;width:1px;background:#4a5258;margin:0 6px;flex-shrink:0}.swatch{width:15px;height:15px;border-radius:50%;background:var(--c);border:1px solid #899198;padding:0}.size{font-size:10px;color:#aab4ba;margin-left:auto;white-space:nowrap}.size input{width:80px;accent-color:#4eb4c4}.chip{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 9px;font-size:11px;color:#b4bec3}.chip.active,.chip:hover{background:#3b464c;border-color:#4a5960}.spacer{flex:1}.work{display:flex;flex:1;min-height:0;background:#34383c;position:relative}.stage{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.panel{width:225px;background:#25292d;border-left:1px solid #454b50;padding:14px;overflow:auto}.panel h3{font-size:12px;margin:5px 0 13px}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.thumb{aspect-ratio:3/4;background:#090a0c;border:1px solid #4c555b;border-radius:5px}.thumb.active{border:1px solid #4eb7c5}.panel p{font-size:11px;color:#929da4;line-height:1.5}.action{width:100%;padding:10px;text-align:left;background:#30373c;border-radius:7px;margin:4px 0;font-size:11px}.counter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#eee;color:#222;border-radius:20px;padding:4px 12px;font-size:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#11171a;border:1px solid #465159;border-radius:8px;padding:9px 14px;opacity:0;pointer-events:none}.toast.show{opacity:1}
@media(max-width:760px){.side{width:58px;padding:12px 6px}.brand{padding:8px 7px 20px;font-size:0}.brand .mark{margin:0}.nav,.subject{font-size:0;text-align:center;padding:12px 4px}.main{padding:22px 14px}.head{align-items:flex-start;flex-direction:column}.actions{width:100%}.search{width:0;flex:1}.preview{height:165px}.panel{position:absolute;right:0;top:0;bottom:0;z-index:4;width:min(235px,82vw);box-shadow:-8px 0 20px #0006}.status{display:none}.title{width:130px}.size{margin-left:4px}}
</style></head><body>
<section class="app" id="library"><aside class="side"><div class="brand"><i class="mark">R</i>Recall Studio</div><button class="nav active" data-filter="All notes">▦　All notes</button><button class="nav" data-filter="Recent">◷　Recent</button><div class="label">SUBJECTS</div><div id="subjects"></div><button class="nav" id="addSubject">＋　Add subject</button><div class="bottom"><button class="nav" id="export">⇧　Export backup</button><button class="nav" id="import">⇩　Import backup</button><input hidden type="file" id="backupFile" accept="application/json"></div></aside><main class="main"><div class="head"><div><div class="eyebrow">YOUR WORKSPACE</div><h1 id="heading">All notes</h1></div><div class="actions"><input class="search" id="search" placeholder="⌕  Search notes"><button class="primary" id="new">＋ New note</button></div></div><div class="subhead"><span id="count">0 notes</span><span>Saved on this device</span></div><div class="grid" id="notes"></div><div class="empty" id="empty"><h2>Your notebook starts here</h2><p>Create a note and write with your stylus.</p><button class="primary" id="first">Create first note</button></div></main></section>
<section class="editor hidden" id="editor"><header class="top"><button class="ib" id="back">‹</button><input class="title" id="title" value="Untitled note"><span class="status" id="status">Saved locally</span><button class="ib" id="undo">↶</button><button class="ib" id="redo">↷</button><button class="ib" id="panelToggle">▤</button><button class="ib" id="recallToggle">◉</button></header><div class="tools"><div class="row" id="toolrow"><button class="tool active" data-tool="pen">✎<small>Pen</small></button><button class="tool" data-tool="pencil">⌁<small>Pencil</small></button><button class="tool" data-tool="highlighter">▰<small>Highlight</small></button><button class="tool" data-tool="eraser">◩<small>Eraser</small></button><i class="sep"></i><button class="tool" data-tool="lasso">〰<small>Lasso</small></button><button class="tool" data-tool="rectangle">□<small>Select</small></button><button class="tool" id="image">▧<small>Image</small></button><button class="tool" data-tool="text">T<small>Text</small></button><button class="tool" id="addPage">＋<small>Page</small></button><i class="sep"></i><input type="color" id="color" value="#f3f3f3" title="Ink colour"><button class="swatch" data-color="#f3f3f3" style="--c:#f3f3f3"></button><button class="swatch" data-color="#f2c94c" style="--c:#f2c94c"></button><button class="swatch" data-color="#eb7777" style="--c:#eb7777"></button><button class="swatch" data-color="#55b9ad" style="--c:#55b9ad"></button><button class="swatch" data-color="#6598df" style="--c:#6598df"></button><button class="swatch" data-color="#b28bd7" style="--c:#b28bd7"></button><label class="size">SIZE <input id="width" type="range" min="1" max="18" value="3"></label></div><div class="row"><button class="chip active" data-paper="blank">Blank</button><button class="chip" data-paper="ruled">Ruled</button><button class="chip" data-paper="grid">Grid</button><i class="sep"></i><button class="chip active" data-mode="page">Page</button><button class="chip" data-mode="infinite">Infinite</button><span class="spacer"></span><button class="chip" id="zoomout">−</button><span id="zoom">100%</span><button class="chip" id="zoomin">＋</button></div></div><main class="work"><div class="stage" id="stage"><canvas id="canvas"></canvas><span class="counter" id="counter">1 / 1</span></div><aside class="panel" id="panel"><h3>PAGE OVERVIEW</h3><div class="thumbs" id="thumbs"></div><hr style="border:0;border-top:1px solid #41484d;margin:18px 0"><h3>ACTIVE RECALL</h3><p>Keep recall masks separate from your original handwriting.</p><button class="action" id="cloze">＋ Create Cloze</button><button class="action" id="occlusion">▧ Image occlusion</button><button class="action" id="pageRecall">◉ Review this page</button><button class="action" id="reveal">Reveal all</button><button class="action" id="hide">Hide all</button></aside></main><input hidden type="file" id="imageFile" accept="image/*"><div class="toast" id="toast"></div></section>
<script type="module">
const $=id=>document.getElementById(id),DB="RecallStudioDB";let db,items=[],subject="All notes",note=null,pi=0,strokes=[],redo=[],active=null,tool="pen",ink="#f3f3f3",size=3,paper="blank",mode="page",zoom=1,saveTimer;
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("notes",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function all(){return new Promise((ok,no)=>{let r=db.transaction("notes").objectStore("notes").getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(){return new Promise((ok,no)=>{let t=db.transaction("notes","readwrite");t.objectStore("notes").put(note);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
const id=()=>crypto.randomUUID(),page=()=>({id:id(),strokes:[],paper:"blank",mode:"page"});
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
async function init(){db=await openDB();items=await all();render();if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{})}
function render(){let q=$("search").value.toLowerCase(),list=items.filter(n=>(subject==="All notes"||n.subject===subject)&&n.title.toLowerCase().includes(q));$("heading").textContent=subject;$("count").textContent=list.length+" notes";$("notes").innerHTML="";$("empty").classList.toggle("hidden",list.length>0);list.forEach(n=>{let b=document.createElement("button");b.className="card";b.innerHTML='<div class="preview">✎</div><div class="name"></div><div class="meta"></div>';b.querySelector(".name").textContent=n.title;b.querySelector(".meta").textContent=n.pages.length+" pages · "+n.subject;b.onclick=()=>openNote(n.id);$("notes").append(b)});let subs=[...new Set(["Biology","Physics","Chemistry",...items.map(n=>n.subject)])];$("subjects").innerHTML="";subs.forEach(s=>{let b=document.createElement("button");b.className="subject"+(subject===s?" active":"");b.textContent="◦　"+s;b.onclick=()=>{subject=s;render()};$("subjects").append(b)})}
async function create(){let title=prompt("Note title","Untitled note");if(title===null)return;let sub=prompt("Subject","Biology")||"Biology";note={id:id(),title:title||"Untitled note",subject:sub,pages:[page()],recall:[],created:Date.now()};await save();items=await all();openNote(note.id)}
async function openNote(nid){note=items.find(n=>n.id===nid)||await new Promise(ok=>{let r=db.transaction("notes").objectStore("notes").get(nid);r.onsuccess=()=>ok(r.result)});pi=0;strokes=note.pages[0].strokes||[];paper=note.pages[0].paper||"blank";mode=note.pages[0].mode||"page";$("title").value=note.title;$("library").classList.add("hidden");$("editor").classList.remove("hidden");setup();draw();thumbs()}
function setup(){let c=$("canvas"),ctx=c.getContext("2d");let resize=()=>{let r=$("stage").getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;draw()};new ResizeObserver(resize).observe($("stage"));resize();c.onpointerdown=e=>{if(e.pointerType!=="pen")return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=point(e);if(tool==="eraser"){strokes=strokes.filter(s=>!s.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<size*3));draw();schedule();return}if(!["pen","pencil","highlighter"].includes(tool))return;active={id:id(),tool,color:ink,size,points:[p]};draw()};c.onpointermove=e=>{if(!active||e.pointerType!=="pen")return;let p=point(e),last=active.points.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>.6){active.points.push(p);draw()}};c.onpointerup=c.onpointercancel=()=>{if(active){strokes.push(active);active=null;redo=[];draw();schedule()}};function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom,p:e.pressure||.5}}}
function draw(){let c=$("canvas"),ctx=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2),w=c.width/d,h=c.height/d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#34383c";ctx.fillRect(0,0,w,h);let pw=mode==="infinite"?Math.max(w*1.8,2000):Math.min(w-40,Math.max(300,h*.72)),ph=mode==="infinite"?Math.max(h*1.8,1500):Math.min(h-30,pw*1.333),x=(w-pw*zoom)/2,y=(h-ph*zoom)/2;ctx.save();ctx.translate(x,y);ctx.scale(zoom,zoom);ctx.fillStyle="#08090b";ctx.fillRect(0,0,pw,ph);if(paper!=="blank"){ctx.strokeStyle="#282d32";ctx.lineWidth=1;ctx.beginPath();let step=paper==="grid"?24:34;for(let yy=step;yy<ph;yy+=step){ctx.moveTo(0,yy);ctx.lineTo(pw,yy)}if(paper==="grid")for(let xx=step;xx<pw;xx+=step){ctx.moveTo(xx,0);ctx.lineTo(xx,ph)}ctx.stroke()}[...strokes,...(active?[active]:[])].forEach(s=>{if(!s.points.length)return;ctx.save();ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.size*(s.tool==="highlighter"?3:1);ctx.lineCap="round";ctx.lineJoin="round";if(s.tool==="highlighter")ctx.globalAlpha=.28;ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));if(s.points.length===1){ctx.arc(s.points[0].x,s.points[0].y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}else ctx.stroke();ctx.restore()});ctx.restore()}
function schedule(){$("status").textContent="Saving…";clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{note.pages[pi].strokes=strokes;note.pages[pi].paper=paper;note.pages[pi].mode=mode;note.title=$("title").value||"Untitled note";await save();$("status").textContent="Saved locally"},350)}
function thumbs(){$("thumbs").innerHTML="";note.pages.forEach((p,i)=>{let b=document.createElement("button");b.className="thumb"+(i===pi?" active":"");b.title="Page "+(i+1);b.onclick=()=>{note.pages[pi].strokes=strokes;note.pages[pi].paper=paper;pi=i;strokes=note.pages[i].strokes||[];paper=note.pages[i].paper||"blank";mode=note.pages[i].mode||"page";draw();thumbs();counter()};$("thumbs").append(b)});counter()}
function counter(){$("counter").textContent=(pi+1)+" / "+note.pages.length}
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x===b))});
$("color").oninput=e=>ink=e.target.value;$("width").oninput=e=>size=+e.target.value;document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{$("color").value=b.dataset.color;ink=b.dataset.color});
document.querySelectorAll("[data-paper]").forEach(b=>b.onclick=()=>{paper=b.dataset.paper;document.querySelectorAll("[data-paper]").forEach(x=>x.classList.toggle("active",x===b));draw();schedule()});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));draw();schedule()});
$("undo").onclick=()=>{if(strokes.length){redo.push(strokes.pop());draw();schedule()}};$("redo").onclick=()=>{if(redo.length){strokes.push(redo.pop());draw();schedule()}};
$("zoomin").onclick=()=>{zoom=Math.min(2.5,zoom+.1);$("zoom").textContent=Math.round(zoom*100)+"%";draw()};$("zoomout").onclick=()=>{zoom=Math.max(.4,zoom-.1);$("zoom").textContent=Math.round(zoom*100)+"%";draw()};
$("addPage").onclick=async()=>{note.pages[pi].strokes=strokes;note.pages[pi].paper=paper;note.pages.push(page());pi=note.pages.length-1;strokes=[];paper="blank";mode="page";draw();thumbs();await save()};
$("panelToggle").onclick=$("recallToggle").onclick=()=>$("panel").classList.toggle("hidden");
$("back").onclick=async()=>{note.pages[pi].strokes=strokes;note.pages[pi].paper=paper;await save();$("editor").classList.add("hidden");$("library").classList.remove("hidden");items=await all();render()};
$("title").onchange=schedule;
$("cloze").onclick=()=>toast("Cloze selection is the next implementation phase.");$("occlusion").onclick=()=>toast("Image occlusion editor is the next implementation phase.");$("pageRecall").onclick=()=>toast("Page recall mode is planned for the recall phase.");$("reveal").onclick=()=>toast("No recall masks created yet.");$("hide").onclick=()=>toast("No recall masks created yet.");
$("image").onclick=()=>$("imageFile").click();$("imageFile").onchange=()=>toast("Image placement tool will be added in the next build.");
$("new").onclick=$("first").onclick=create;$("search").oninput=render;$("addSubject").onclick=()=>{let s=prompt("Subject name");if(s){subject=s;render()}};
$("export").onclick=async()=>{let blob=new Blob([JSON.stringify({format:"RecallStudioBackup",version:1,notes:await all()})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recall-studio-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("import").onclick=()=>$("backupFile").click();$("backupFile").onchange=async()=>{try{let data=JSON.parse(await $("backupFile").files[0].text());if(data.format!=="RecallStudioBackup")throw Error("Wrong backup format");let tx=db.transaction("notes","readwrite"),s=tx.objectStore("notes");s.clear();data.notes.forEach(n=>s.put(n));tx.oncomplete=async()=>{items=await all();render();toast("Backup imported")}}catch(e){alert("Import failed: "+e.message)}};
init();
</script></body></html>
