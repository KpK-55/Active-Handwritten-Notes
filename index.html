<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#202124"><meta name="description" content="A handwriting-first active recall notebook">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>RecallNote</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="backBtn" aria-label="Back">‹</button><div class="brand">Recall<span>Note</span></div>
  <div class="docname" id="docName">Untitled notebook</div>
  <div class="top-actions"><span id="saveStatus" class="status">Saved locally</span><button class="modebtn" id="importNoteBtn" title="Import StarNote .note">Import .note</button><input id="noteFileInput" type="file" accept=".note,application/zip" hidden>
  <button class="iconbtn" id="newPageBtn" title="New page">＋</button><button class="iconbtn" id="installBtn" hidden title="Install app">⇩</button><button class="iconbtn" id="menuBtn" title="More">⋯</button></div>
</header>
<nav class="toolbar" aria-label="Drawing tools">
  <div class="toolgroup">
    <button class="tool active" data-tool="pen" title="Pen">✎<small>Pen</small></button>
    <button class="tool" data-tool="pencil" title="Pencil">✐<small>Pencil</small></button>
    <button class="tool" data-tool="highlighter" title="Highlighter">▰<small>Highlight</small></button>
    <button class="tool" data-tool="eraser" title="Eraser">◩<small>Eraser</small></button>
    <button class="tool" data-tool="lasso" title="Lasso">⌁<small>Lasso</small></button>
  </div>
  <div class="separator"></div>
  <div class="toolgroup compact">
    <button class="iconbtn" id="undoBtn" title="Undo">↶</button><button class="iconbtn" id="redoBtn" title="Redo">↷</button>
  </div>
  <div class="separator"></div>
  <div class="swatches" id="swatches"><button class="swatch selected" data-color="#f4f4f4" style="--sw:#f4f4f4"></button><button class="swatch" data-color="#f3c84b" style="--sw:#f3c84b"></button><button class="swatch" data-color="#f08080" style="--sw:#f08080"></button><button class="swatch" data-color="#69b8df" style="--sw:#69b8df"></button><button class="swatch" data-color="#79c69a" style="--sw:#79c69a"></button></div>
  <div class="separator"></div>
  <label class="size-control">Size <input id="sizeRange" type="range" min="1" max="18" value="3"><output id="sizeValue">3</output></label>
  <div class="separator"></div>
  <button class="modebtn" id="canvasModeBtn">Fixed page ▾</button>
  <button class="modebtn recall" id="createClozeBtn" title="Create cloze from lasso selection">＋ Cloze</button>
  <button class="modebtn recall" id="recallBtn" title="Toggle recall mode">✦ Recall</button>
  <button class="modebtn" id="imageBtn" title="Insert image">▧ Image</button>
  <button class="modebtn" id="occlusionBtn" title="Draw image occlusion masks">▣ Mask</button>
  <button class="modebtn" id="revealAllBtn" title="Reveal all answers">Reveal all</button>
  <button class="modebtn" id="hideAllBtn" title="Hide all answers">Hide all</button>
  <input id="imageInput" type="file" accept="image/*" hidden>
</nav>
<main class="workspace">
  <aside class="sidepanel" id="sidepanel"><div class="side-title">PAGES <button id="addPageSide">＋</button></div><div id="pageList" class="page-list"></div><div class="side-footer">Local notebook</div></aside>
  <section class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap"><canvas id="paper"></canvas><canvas id="overlay"></canvas></div>
    <div class="floating-controls"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitBtn" title="Fit page">⤢</button></div>
    <div class="page-indicator" id="pageIndicator">1 / 1</div>
    <div class="hint" id="hint">Use your stylus or finger to write</div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<dialog id="modeDialog"><h3>Canvas type</h3><button data-mode="fixed">Fixed paper page</button><button data-mode="infinite">Infinite canvas</button><button class="dialog-close">Cancel</button></dialog>
<dialog id="recallDialog"><h3>Recall mode</h3><p id="recallInfo">Tap a hidden region to reveal it.</p><button class="dialog-close">Close</button></dialog>
<dialog id="menuDialog"><h3>Notebook options</h3><button id="renameBtn">Rename notebook</button><button id="clearPageBtn">Clear current page</button><button id="exportBtn">Export page as PNG</button><button id="backupBtn">Download notebook backup</button><button class="dialog-close">Close</button></dialog>
<script src="jszip.min.js"></script><script src="app.js"></script>
</body></html>
